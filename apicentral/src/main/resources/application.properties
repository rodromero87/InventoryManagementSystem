# H2 (modo PG p/ facilitar migração futura)
spring.datasource.url=jdbc:h2:mem:centraldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

# Server
server.port=8081

# App (seletor simples de publisher: in-memory | sns)
#app.events.publisher=in-memory

# AWS (LocalStack ou real)
app.events.publisher=sns
aws.region=us-east-1
aws.endpoint=http://localhost:4566
aws.topic-arn=arn:aws:sns:us-east-1:000000000000:inventory-updates

